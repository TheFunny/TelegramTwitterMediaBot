[package]
name = "x-media"
version = "1.9.3"
edition = "2024"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1.12"
html-escape = "0.3"
url = "2.5.2"
bytes = "1"
# ugoira frame zips are stored/deflate only; everything in zip's default
# codec set (bzip2, lzma/xz, ppmd, aes, time, zstd) is dead weight here —
# and zip <=9.0.0 pinned the zstd 0.13 stack that has no fixed release
# (RUSTSEC-2026-039x/-041x), which is what kept the audit gate red.
zip = { version = "9", default-features = false, features = ["deflate"] }
tempfile = "3"
thiserror = "2"
rand = "0.10"
log = "0.4"
tokio = { version = "1.40", features = ["time", "rt", "fs"] }

[dev-dependencies]
tokio = { version = "1.40", features = ["macros", "rt-multi-thread"] }
dotenv = "0.15"
